server {
  listen 80;
  gzip on; gzip_comp_level 6; gzip_min_length 256; gzip_proxied any;
  gzip_types text/html text/css application/javascript image/svg+xml application/json;
  location / { proxy_pass http://7hills-staging-nginx; proxy_set_header Host 7hills-staging-nginx; proxy_set_header Accept-Encoding ""; }
  location /build/ { proxy_pass http://7hills-staging-nginx; proxy_set_header Host 7hills-staging-nginx; proxy_set_header Accept-Encoding ""; expires 1y; }
}
