# 7Hills Digital — STAGING stack for the revamp branch.
#
# Runs from the revamp worktree, never from /opt/docker/7hillsdigital: that
# checkout is bind-mounted into the live containers, so editing it edits the
# live site. Everything here is separate — container names, network, volume and
# port — so staging can be torn down without touching production.
#
#   docker compose -p 7hills-staging -f docker/staging/docker-compose.yml up -d
#
# Reuses the production image (7hillsdigital/app) rather than building one, so
# staging runs exactly the PHP that production runs.

services:
  app:
    image: 7hillsdigital/app
    container_name: 7hills-staging-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ../../:/var/www/html
      - ../php/local.ini:/usr/local/etc/php/conf.d/zz-local.ini:ro
    environment:
      TZ: Africa/Johannesburg
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - staging

  nginx:
    image: nginx:1.27-alpine
    container_name: 7hills-staging-nginx
    restart: unless-stopped
    ports:
      # 8080, 8090, 8091 (production), 8094, 8095 and 3700 are taken.
      - "127.0.0.1:8096:80"
    volumes:
      - ../../:/var/www/html:ro
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - staging

  # No host port: staging's database is reachable only from inside the stack.
  mysql:
    image: mysql:8.0
    container_name: 7hills-staging-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-sevenhills}
      MYSQL_USER: ${DB_USERNAME:-sevenhills}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
      TZ: Africa/Johannesburg
    volumes:
      - staging-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - staging

networks:
  staging:
    driver: bridge

volumes:
  staging-mysql:
    driver: local
